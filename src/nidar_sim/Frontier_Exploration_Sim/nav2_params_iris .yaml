# Nav2 params for iris quadcopter treated as a 2D robot at fixed altitude.
# ROS 2 Humble, nav2_bringup navigation_launch.py (no amcl, no map_server —
# slam_toolbox owns /map and map->odom).
#
# VERIFIED against live TF tree + topic list on 2026-08-24:
#   map -> odom -> base_link confirmed; /odometry is nav_msgs/Odometry.
# Original checklist kept for reference:
#   1. Frame names: ros2 run tf2_ros tf2_echo map base_link
#      and: ros2 run tf2_ros tf2_echo odom base_link
#      If your frames differ (e.g. base_link_frd), fix every robot_base_frame
#      and global_frame below.
#   2. Odom topic: ros2 topic list | grep local_position
#   3. Scan topic: assumed /scan.
#
# AMENDED 2 Nov 2026 (Claude): both costmaps' obstacle_layer now point at
# /scan_safe instead of /scan. This branch predates scan_stabilizer.py
# (/scan -> /scan_safe, tilt re-projected out), which this team added later
# and which nidar_sim/config/nav2_params.yaml — the actually-flown config —
# already reads from. Raw /scan let hover-attitude noise jitter wall
# positions a few cm between scans; with global_costmap.update_frequency
# matching bt_navigator's 1Hz RateController, NavFn flipped between two
# near-equal-cost routes almost every replan even for an unmoved goal
# (observed live: path length swinging 177->169->174->189->187->173->165->132
# across consecutive replans of the same goal). path_follower.py re-targets
# its carrot onto every new /plan, so each flip showed up as the drone
# visibly weaving mid-corridor. default_nav_to_pose_bt_xml below was also
# already repointed from the original /home/bincy/... path to this checkout.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry
    default_nav_to_pose_bt_xml: "/home/karthik/ardu_ws/src/nidar_sim/Frontier_Exploration_Sim/nidar_bt.xml"
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    # 10 Hz instead of 20 — VM CPU budget.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      # 360-degree lidar: final heading is irrelevant, don't spin at goals.
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: -0.3
      min_vel_y: -0.3
      # Conservative for 1m corridors; raise after it works.
      max_vel_x: 0.3
      max_vel_y: 0.3
      max_vel_theta: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 1.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.8
      decel_lim_y: -1.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 1
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      # Generous: VM + SITL TF latency.
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.35
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["Oscillation", "BaseObstacle", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # AMENDED 2 Nov 2026: was 0.30. THE critical number for 1m corridors:
      # free centerline band = corridor_width - 2*robot_radius = 1.0-0.5=0.5m.
      # 0.25 matches nidar_sim/config/nav2_params.yaml (this team's actual
      # flown config) and the real competition airframe, not the Iris's own
      # prop radius.
      robot_radius: 0.25
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_safe
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # AMENDED 2 Nov 2026, twice. First 0.5->0.35: at 0.5, in a 1.0m
        # corridor, each wall's gradient reached 0.5m in - 0.5+0.5=1.0m
        # covered the ENTIRE width, no flat zero-cost floor anywhere, only a
        # ridge NavFn had to thread (visually confirmed: costmap screenshot
        # showed corridors pinched almost shut). Then 0.35->0.3 alongside
        # robot_radius 0.30->0.25: 0.3+0.3=0.6m overlap, leaving 1.0-0.6=0.4m
        # of flat centerline - still > inflation_radius(0.3) >= robot_radius
        # (0.25), which inflation layers require to fully cover the robot's
        # own footprint. cost_scaling_factor unchanged.
        cost_scaling_factor: 5.0
        inflation_radius: 0.3
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # AMENDED 2 Nov 2026 — see local_costmap's robot_radius comment.
      robot_radius: 0.25
      resolution: 0.05
      # Critical for exploration: unknown must NOT be treated as free,
      # or frontier semantics degrade and the planner cuts through unmapped space.
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # slam_toolbox publishes transient_local.
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_safe
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # AMENDED 2 Nov 2026 — see local_costmap's inflation_layer comment.
        cost_scaling_factor: 5.0
        inflation_radius: 0.3
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # Frontier goals sit at the known/unknown boundary; the planner
      # must be allowed to plan near unknown space.
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.3, 0.0]
    # Small negative x allowed so the BackUp recovery can work.
    min_velocity: [-0.3, -0.3, 0.0]
    max_accel: [0.8, 1.0, 1.5]
    max_decel: [-0.8, -1.0, -1.5]
    odom_topic: "/odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
