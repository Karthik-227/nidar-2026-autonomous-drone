[develop]
script_dir=$base/lib/nidar_sim
[install]
install_scripts=$base/lib/nidar_sim

[flake8]
# 120, not ament's default 99. The nodes in this package carry a lot of
# explanatory comment next to the line being explained, and at 99 columns that
# reasoning has to be broken up or moved away from what it describes - which
# makes it less useful, not more compliant. 120 is still a hard limit and is
# enforced: `colcon test` fails above it.
max-line-length = 120
exclude = .git,__pycache__,build,install,log,sim,GUI,humandetection

[tool:pytest]
# nidar_sim's lint tests must not walk into the sibling ROS packages in this
# repo. GUI/ and humandetection/ are separate packages with their own test
# suites, and pytest *imports* what it collects - so collecting
# humandetection dragged in cv_bridge and ultralytics, which currently fail to
# import at all under NumPy 2.x (see SETUP.md). The result was that
# `colcon test --packages-select nidar_sim` failed on a collection error in a
# package it was not even testing.
norecursedirs = GUI humandetection sim build install log images patches .git
